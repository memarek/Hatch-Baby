<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bedtime">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Bedtime</title>
<style>
  :root {
    --bg: #0c0f22;
    --surface: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f1eff8;
    --muted: #a3a6c4;
    --accent: #ffb86b;
    --accent-2: #ff9a45;
    --ink: #2a1703;
    --danger: #ff8a8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff9 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 34%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 62%, #fff5 50%, transparent 51%),
      radial-gradient(1px 1px at 64% 78%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 40% 8%, #fff5 50%, transparent 51%),
      radial-gradient(900px 520px at 50% 0%, #262f63 0%, transparent 70%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  .logo {
    width: 96px; height: 96px; border-radius: 26px; display: block; margin: 0 auto 22px;
    box-shadow: 0 18px 50px -12px rgba(255, 168, 80, 0.45), 0 0 0 1px var(--line);
  }
  h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); margin: 6px 0 34px; font-size: 16px; }
  form { text-align: left; }
  .field { position: relative; }
  label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input {
    width: 100%; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 17px 54px 17px 18px; outline: none; transition: border-color .15s, background .15s;
    -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.09); }
  .reveal {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border: 0; background: none; color: var(--muted);
    border-radius: 12px; cursor: pointer; display: grid; place-items: center;
  }
  .reveal:focus-visible { outline: 2px solid var(--accent); }
  .reveal svg { width: 22px; height: 22px; }
  .error { color: var(--danger); font-size: 15px; min-height: 22px; margin: 10px 4px 0; }
  button[type=submit] {
    width: 100%; margin-top: 14px; border: 0; border-radius: 16px; padding: 17px;
    font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px -10px rgba(255, 154, 69, 0.7);
    transition: transform .1s, filter .15s;
  }
  button[type=submit]:active { transform: scale(0.98); filter: brightness(0.95); }
  button[type=submit]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .foot { color: var(--muted); font-size: 13px; margin-top: 28px; opacity: 0.8; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon.svg" alt="">
  <h1>Bedtime</h1>
  <p class="sub">Music and nightlight, one tap.</p>
  <form method="post" action="/login" id="form">
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password"
             autocomplete="current-password" required>
      <button type="button" class="reveal" id="reveal" aria-label="Show password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
  <p class="foot">Private to your family</p>
</main>
<script>
  const error = new URLSearchParams(location.search).get("error");
  const message = error === "locked" ? "Too many tries. Wait 15 minutes and try again."
                : error === "wrong" ? "That password didn't work." : "";
  document.getElementById("error").textContent = message;
  if (message) {
    const form = document.getElementById("form");
    form.classList.add("shake");
    history.replaceState(null, "", "/login");
  }
  const input = document.getElementById("password");
  const reveal = document.getElementById("reveal");
  reveal.onclick = () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    reveal.setAttribute("aria-label", show ? "Hide password" : "Show password");
    input.focus();
  };
</script>
</body>
</html>
